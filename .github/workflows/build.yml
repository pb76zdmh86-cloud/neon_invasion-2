name: Build macOS app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Скачать исходники
        uses: actions/checkout@v7

      - name: Установить Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Установить зависимости
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Собрать приложение
        run: |
          python -m PyInstaller \
            --noconfirm \
            --windowed \
            --name "Neon Invasion" \
            --add-data "images:images" \
            --add-data "sounds:sounds" \
            --add-data "logo.png:." \
            --add-data "PressStart2P-Regular.ttf:." \
            --add-data "Orbitron-Bold.ttf:." \
            alien_invasion.py

      - name: Упаковать приложение
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/Neon Invasion.app" \
            "Neon-Invasion-macOS.zip"

      - name: Сохранить архив сборки
        uses: actions/upload-artifact@v7
        with:
          name: Neon-Invasion-macOS
          path: Neon-Invasion-macOS.zip
          if-no-files-found: error